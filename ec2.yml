- name: creating ec2
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
     aws_region: "us-east-1"
     vpc_id: "vpc-0e57b870dfce16536" 
Description: Creating ec2
Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0567589d25e06853e
      KeyName: excersie
      SecurityGroups:
        - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: cicd-firstserver


